<!-- Simple vector placeholder image. It's an SVG so it's stored as text and works without binary files. -->
<svg xmlns="http://www.w3.org/2000/svg" width="400" height="240" viewBox="0 0 400 240">
  <rect width="100%" height="100%" fill="#e2e8f0"/>
  <circle cx="80" cy="80" r="48" fill="#2b6cb0" />
  <rect x="150" y="40" width="200" height="120" rx="12" ry="12" fill="#fff" stroke="#cbd5e1"/>
  <text x="200" y="120" font-size="18" font-family="Arial" fill="#4a5568" text-anchor="middle">Sample Image</text>
</svg>
