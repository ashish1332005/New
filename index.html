<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>My Website</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header><h1>Welcome</h1></header>
  <main>
    <section>
      <h2>Image from assets</h2>
      <img src="assets/images/sample.svg" alt="Sample image" width="300">
    </section>
    <section>
      <h2>Video from assets</h2>
      <!-- Try adding assets/videos/sample.mp4 or edit src to an external URL -->
      <video controls width="480">
        <source src="assets/videos/sample.mp4" type="video/mp4">
        Your browser does not support the video tag. To test, you can use this sample video:
        <a href="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4">Sample video</a>
      </video>
    </section>
    <button id="btn">Click me</button>
  </main>
  <script src="js/script.js"></script>
</body>
</html>
